# Mouse off by default; uncomment to enable.
# set -g mouse on

# Behavior
set -g history-limit 5000
setw -g mode-keys vi

# Snappier vim inside tmux; longer window for prefix+arrow pane resizes.
set -sg escape-time 1
set -g repeat-time 1000

# 1-indexed windows/panes; auto-close numbering gaps.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Notify on activity in other windows.
setw -g monitor-activity on
set -g visual-activity on

# Use the user's login shell rather than a hard-coded path
# (works on Arch /usr/bin/zsh, macOS /opt/homebrew/bin/zsh, etc.).
set -g default-shell "$SHELL"

# tmux-256color exposes italics/curly underlines via terminfo;
# the RGB override re-enables truecolor inside tmux when the outer terminal supports it.
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*256col*:RGB"

# Visual-select + yank in copy mode (tmux-yank pipes the selection to the system clipboard).
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Reload config in place.
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# New splits inherit cwd of the current pane (default is $HOME).
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind -r n next-window
bind -r p previous-window
bind -r Tab last-window           # Ctrl+b Tab toggles to last window

# Alt+1 through Alt+9 jumps directly to window 1-9
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9

# Alt+`  → next window (cycle forward)
bind -n "M-`" next-window

# Plugins (TPM). Bootstrap TPM itself on a fresh machine so `prefix + I` works out of the box.
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

# Initialize TPM — must be the very last line.
run '~/.tmux/plugins/tpm/tpm'
