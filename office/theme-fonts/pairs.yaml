# scheme_name: what shows up in Office dropdown
# major: heading font
# minor: body font
pairs:
  - scheme_name: "Plex Sans + Source Serif 4"
    major: "IBM Plex Sans"
    minor: "Source Serif 4"

  - scheme_name: "Plex Sans"
    major: "IBM Plex Sans"
    minor: "IBM Plex Sans"

  - scheme_name: "Fira Sans"
    major: "Fira Sans"
    minor: "Fira Sans"
